[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuelos"
version = "0.1.0"
description = "Taller de Machine Learning: retrasos de vuelos en EE. UU. (mayo 2025 - mayo 2026)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
